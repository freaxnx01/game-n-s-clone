document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"59c27182-1b96-4978-8a9a-351a197d200d\"><\/script>\n<\/head>\n<body>\n<x-dc>\n\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"04832a25-8bb3-4dd6-bac0-e9aa4d20e468\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"3c39f7ac-19b3-4d36-b7be-d194573955f3\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"725d1775-a107-41f0-b9c5-8b16768aaa79\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"9aa4b61c-6468-4200-b4bc-af6f96e1a540\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"15fdb575-9028-4991-897d-7544d5790d9b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\/style>\n<style>\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  html, body { height: 100%; }\n  body { background: #0c0e12; }\n  @keyframes ns-blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: 0.25; } }\n<\/style>\n<\/helmet>\n<div style=\"min-height: 100vh; background: radial-gradient(circle at 50% 38%, #20283a 0%, #0c0e12 78%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px; font-family: 'Press Start 2P', monospace; color: #e9ecf3; user-select: none;\">\n\n  <div style=\"display: flex; align-items: baseline; gap: 14px; text-shadow: 3px 3px 0 #000;\">\n    <span style=\"font-size: 22px; color: #5e7cff; letter-spacing: 1px;\">NORTH<\/span>\n    <span style=\"font-size: 13px; color: #c7ad6a;\">&amp;<\/span>\n    <span style=\"font-size: 22px; color: #c3cad6; letter-spacing: 1px;\">SOUTH<\/span>\n  <\/div>\n\n  <div onclick=\"{{ onFrameClick }}\" style=\"position: relative; width: min(95vw, 1040px); aspect-ratio: 520 / 290; border: 4px solid #2b3142; border-radius: 4px; box-shadow: 0 0 0 2px #11141c, 0 18px 48px rgba(0,0,0,0.6), inset 0 0 0 1px #000; background: #4e9b30; overflow: hidden; cursor: pointer;\">\n    <canvas id=\"ns-battlefield\" ref=\"{{ setCanvas }}\" width=\"520\" height=\"290\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated;\"><\/canvas>\n\n    <!-- top army panels -->\n    <div style=\"position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 10px; pointer-events: none;\">\n      <div style=\"display: flex; flex-direction: column; gap: 5px; background: rgba(12,16,28,0.72); border: 2px solid #3a4a8a; padding: 6px 8px; border-radius: 3px;\">\n        <span style=\"font-size: 8px; color: #8aa0ff; letter-spacing: 1px;\">NORTH<\/span>\n        <div style=\"display: flex; gap: 9px; font-size: 9px; color: #cdd6ff;\">\n          <span><span style=\"color:#5e7cff;\">I<\/span> {{ nInf }}<\/span>\n          <span><span style=\"color:#5e7cff;\">C<\/span> {{ nCav }}<\/span>\n          <span><span style=\"color:#5e7cff;\">A<\/span> {{ nCan }}<\/span>\n        <\/div>\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 5px; align-items: flex-end; background: rgba(12,16,28,0.72); border: 2px solid #6a4040; padding: 6px 8px; border-radius: 3px;\">\n        <span style=\"font-size: 8px; color: #d7b3b3; letter-spacing: 1px;\">SOUTH<\/span>\n        <div style=\"display: flex; gap: 9px; font-size: 9px; color: #e6d6d6;\">\n          <span><span style=\"color:#d06a6a;\">I<\/span> {{ sInf }}<\/span>\n          <span><span style=\"color:#d06a6a;\">C<\/span> {{ sCav }}<\/span>\n          <span><span style=\"color:#d06a6a;\">A<\/span> {{ sCan }}<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <!-- selected group readout -->\n    <div style=\"position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); background: rgba(12,16,28,0.72); border: 2px solid #3a4a8a; padding: 5px 10px; border-radius: 3px; font-size: 9px; color: #cdd6ff; pointer-events: none; display: flex; gap: 10px; align-items: center;\">\n      <span style=\"color: #c7ad6a;\">{{ selLabel }}<\/span>\n      <span style=\"color: #8aa0c0;\">{{ selState }}<\/span>\n    <\/div>\n\n    <!-- mode-select menu -->\n    <sc-if value=\"{{ showMenu }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position: absolute; inset: 0; background: rgba(8,10,16,0.82); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px;\">\n        <span style=\"font-size: 16px; color: #c7ad6a; text-shadow: 2px 2px 0 #000;\">BATTLE OF THE BRIDGE<\/span>\n        <span style=\"font-size: 8px; line-height: 2.2; color: #cfd6e6; max-width: 560px;\">Cross the bridge. Break the enemy.<\/span>\n        <div style=\"display: flex; flex-direction: column; gap: 9px; align-items: stretch; min-width: 230px;\">\n          <button onclick=\"{{ pickAI }}\" style=\"font: inherit; font-size: 10px; color: #e9ecf3; background: #2a3f9e; border: 2px solid #5e7cff; padding: 11px 14px; cursor: pointer; border-radius: 3px;\">SINGLE — VS AI<\/button>\n          <button onclick=\"{{ pickLocal }}\" style=\"font: inherit; font-size: 10px; color: #e9ecf3; background: #3a4a2a; border: 2px solid #7ec46a; padding: 11px 14px; cursor: pointer; border-radius: 3px;\">LOCAL — 2 PLAYERS<\/button>\n          <button onclick=\"{{ openHost }}\" style=\"font: inherit; font-size: 10px; color: #e9ecf3; background: #6a4040; border: 2px solid #d06a6a; padding: 11px 14px; cursor: pointer; border-radius: 3px;\">ONLINE — HOST<\/button>\n          <button onclick=\"{{ openJoin }}\" style=\"font: inherit; font-size: 10px; color: #e9ecf3; background: #4a3a5a; border: 2px solid #b48ad0; padding: 11px 14px; cursor: pointer; border-radius: 3px;\">ONLINE — JOIN<\/button>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n\n    <!-- online: host screen -->\n    <sc-if value=\"{{ showHost }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position: absolute; inset: 0; background: rgba(8,10,16,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 18px; overflow: auto;\">\n        <span style=\"font-size: 12px; color: #d06a6a; text-shadow: 2px 2px 0 #000;\">ONLINE — HOST (YOU: NORTH)<\/span>\n        <span style=\"font-size: 7px; line-height: 1.8; color: #a9b2c6;\">1. Copy this invite code, send it to your opponent.<\/span>\n        <textarea ref=\"{{ refHostCode }}\" readonly placeholder=\"Creating code…\" style=\"width: min(80vw, 460px); height: 46px; resize: none; font-family: monospace; font-size: 9px; padding: 6px; border: 1px solid #3a4a8a; border-radius: 3px; background: #10141c; color: #cdd6ff;\"><\/textarea>\n        <button onclick=\"{{ copyHost }}\" style=\"font: inherit; font-size: 8px; color: #e9ecf3; background: #2b3142; border: 1px solid #5e7cff; padding: 7px 12px; cursor: pointer; border-radius: 3px;\">COPY INVITE<\/button>\n        <span style=\"font-size: 7px; line-height: 1.8; color: #a9b2c6;\">2. Paste their reply code, then CONNECT.<\/span>\n        <textarea ref=\"{{ refHostAnswer }}\" placeholder=\"Paste reply code…\" style=\"width: min(80vw, 460px); height: 46px; resize: none; font-family: monospace; font-size: 9px; padding: 6px; border: 1px solid #3a4a8a; border-radius: 3px; background: #10141c; color: #cdd6ff;\"><\/textarea>\n        <button onclick=\"{{ hostConnect }}\" style=\"font: inherit; font-size: 9px; color: #fff; background: #2a3f9e; border: 2px solid #5e7cff; padding: 9px 16px; cursor: pointer; border-radius: 3px;\">CONNECT<\/button>\n        <span style=\"font-size: 8px; min-height: 12px; color: {{ netStatusColor }};\">{{ netStatus }}<\/span>\n        <button onclick=\"{{ backToMenu }}\" style=\"font: inherit; font-size: 7px; color: #8a93a6; background: transparent; border: none; padding: 4px; cursor: pointer;\">BACK TO MENU<\/button>\n      <\/div>\n    <\/sc-if>\n\n    <!-- online: join screen -->\n    <sc-if value=\"{{ showJoin }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position: absolute; inset: 0; background: rgba(8,10,16,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 18px; overflow: auto;\">\n        <span style=\"font-size: 12px; color: #b48ad0; text-shadow: 2px 2px 0 #000;\">ONLINE — JOIN (YOU: SOUTH)<\/span>\n        <span style=\"font-size: 7px; line-height: 1.8; color: #a9b2c6;\">1. Paste the host's invite code, then CREATE REPLY.<\/span>\n        <textarea ref=\"{{ refJoinCode }}\" placeholder=\"Paste invite code…\" style=\"width: min(80vw, 460px); height: 46px; resize: none; font-family: monospace; font-size: 9px; padding: 6px; border: 1px solid #6a4a8a; border-radius: 3px; background: #10141c; color: #cdd6ff;\"><\/textarea>\n        <button onclick=\"{{ joinReply }}\" style=\"font: inherit; font-size: 9px; color: #fff; background: #4a3a5a; border: 2px solid #b48ad0; padding: 9px 16px; cursor: pointer; border-radius: 3px;\">CREATE REPLY<\/button>\n        <span style=\"font-size: 7px; line-height: 1.8; color: #a9b2c6;\">2. Copy the reply code, send it back to the host, then wait.<\/span>\n        <textarea ref=\"{{ refJoinAnswer }}\" readonly placeholder=\"Reply code appears here…\" style=\"width: min(80vw, 460px); height: 46px; resize: none; font-family: monospace; font-size: 9px; padding: 6px; border: 1px solid #6a4a8a; border-radius: 3px; background: #10141c; color: #cdd6ff;\"><\/textarea>\n        <button onclick=\"{{ copyJoin }}\" style=\"font: inherit; font-size: 8px; color: #e9ecf3; background: #2b3142; border: 1px solid #b48ad0; padding: 7px 12px; cursor: pointer; border-radius: 3px;\">COPY REPLY<\/button>\n        <span style=\"font-size: 8px; min-height: 12px; color: {{ netStatusColor }};\">{{ netStatus }}<\/span>\n        <button onclick=\"{{ backToMenu }}\" style=\"font: inherit; font-size: 7px; color: #8a93a6; background: transparent; border: none; padding: 4px; cursor: pointer;\">BACK TO MENU<\/button>\n      <\/div>\n    <\/sc-if>\n\n    <!-- victory overlay -->\n    <sc-if value=\"{{ showVictory }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position: absolute; inset: 0; background: rgba(8,14,26,0.82); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center;\">\n        <span style=\"font-size: 20px; color: {{ endColor }}; text-shadow: 3px 3px 0 #000;\">{{ endTitle }}<\/span>\n        <span style=\"font-size: 9px; color: #cfd6e6;\">The field is decided.<\/span>\n        <span style=\"font-size: 10px; color: #c7ad6a; animation: ns-blink 1.1s steps(1) infinite;\">{{ endHint }}<\/span>\n      <\/div>\n    <\/sc-if>\n\n    <!-- defeat overlay -->\n    <sc-if value=\"{{ showDefeat }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position: absolute; inset: 0; background: rgba(20,8,8,0.82); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center;\">\n        <span style=\"font-size: 20px; color: {{ endColor }}; text-shadow: 3px 3px 0 #000;\">{{ endTitle }}<\/span>\n        <span style=\"font-size: 9px; color: #e6cfcf;\">The field is decided.<\/span>\n        <span style=\"font-size: 10px; color: #c7ad6a; animation: ns-blink 1.1s steps(1) infinite;\">{{ endHint }}<\/span>\n      <\/div>\n    <\/sc-if>\n  <\/div>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; font-size: 8px; line-height: 1.6; color: #8a93a6; max-width: 1040px; text-align: center;\">\n    <span><span style=\"color:#5e7cff;\">NORTH<\/span><\/span>\n    <span><span style=\"color:#c7ad6a;\">1 2 3<\/span> SELECT INF / CAV / CANNON<\/span>\n    <span><span style=\"color:#c7ad6a;\">ARROWS<\/span> MOVE GROUP<\/span>\n    <span><span style=\"color:#c7ad6a;\">SPACE<\/span> CHARGE / HALT<\/span>\n    <span><span style=\"color:#c7ad6a;\">A<\/span> ALL ATTACK<\/span>\n    <span><span style=\"color:#c7ad6a;\">H<\/span> ALL HALT<\/span>\n  <\/div>\n\n  <sc-if value=\"{{ showP2 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"font-size: 8px; line-height: 1.6; color: #d09090; max-width: 1040px; text-align: center;\">{{ p2Hint }}<\/div>\n  <\/sc-if>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1040,&quot;height&quot;:640},&quot;difficulty&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Easy&quot;,&quot;Normal&quot;,&quot;Hard&quot;],&quot;default&quot;:&quot;Normal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Battle&quot;},&quot;armySize&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Skirmish&quot;,&quot;Standard&quot;,&quot;Massive&quot;],&quot;default&quot;:&quot;Standard&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Battle&quot;},&quot;friendlyFire&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Battle&quot;}}\">\n/* ---------- connect-code codec (ported from Stack Duel / Tank Toys) ---------- */\nfunction _scB64(u8) {\n  let s = '';\n  for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);\n  return btoa(s).replace(/\\+/g, '-').replace(/\\//g, '_').replace(/=+$/, '');\n}\nfunction _scUnb64(s) {\n  s = s.replace(/-/g, '+').replace(/_/g, '/');\n  while (s.length % 4) s += '=';\n  const bin = atob(s), u8 = new Uint8Array(bin.length);\n  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);\n  return u8;\n}\nasync function _scEncodeCode(obj) {\n  const json = JSON.stringify(obj);\n  try {\n    const cs = new CompressionStream('deflate-raw');\n    const buf = await new Response(new Blob([json]).stream().pipeThrough(cs)).arrayBuffer();\n    return 'S1.' + _scB64(new Uint8Array(buf));\n  } catch (e) {\n    return 'S0.' + _scB64(new TextEncoder().encode(json));\n  }\n}\nasync function _scDecodeCode(str) {\n  str = (str || '').trim().replace(/\\s+/g, '');\n  const i = str.indexOf('.');\n  if (i < 0) throw new Error('bad code');\n  const tag = str.slice(0, i), bytes = _scUnb64(str.slice(i + 1));\n  let text;\n  if (tag === 'S1') {\n    const ds = new DecompressionStream('deflate-raw');\n    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();\n    text = new TextDecoder().decode(buf);\n  } else {\n    text = new TextDecoder().decode(bytes);\n  }\n  return JSON.parse(text);\n}\n\n/* ---------- WebRTC manual-signaling link ---------- */\nclass NetLink {\n  constructor(onMsg, onState) {\n    this.onMsg = onMsg; this.onState = onState; this.ch = null;\n    this.pc = new RTCPeerConnection({\n      iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }]\n    });\n    this.pc.onconnectionstatechange = () => this.onState(this.pc.connectionState);\n  }\n  _wire(ch) {\n    this.ch = ch;\n    ch.onopen = () => this.onState('open');\n    ch.onclose = () => this.onState('closed');\n    ch.onmessage = (e) => { try { this.onMsg(JSON.parse(e.data)); } catch (_) {} };\n  }\n  _gather() {\n    return new Promise((res) => {\n      if (this.pc.iceGatheringState === 'complete') return res();\n      const t = setTimeout(res, 4000);\n      this.pc.addEventListener('icegatheringstatechange', () => {\n        if (this.pc.iceGatheringState === 'complete') { clearTimeout(t); res(); }\n      });\n    });\n  }\n  async host() {\n    this._wire(this.pc.createDataChannel('game'));\n    await this.pc.setLocalDescription(await this.pc.createOffer());\n    await this._gather();\n    return _scEncodeCode(this.pc.localDescription);\n  }\n  async acceptAnswer(code) {\n    await this.pc.setRemoteDescription(await _scDecodeCode(code));\n  }\n  async join(code) {\n    this.pc.ondatachannel = (e) => this._wire(e.channel);\n    await this.pc.setRemoteDescription(await _scDecodeCode(code));\n    await this.pc.setLocalDescription(await this.pc.createAnswer());\n    await this._gather();\n    return _scEncodeCode(this.pc.localDescription);\n  }\n  send(o) { if (this.ch && this.ch.readyState === 'open') this.ch.send(JSON.stringify(o)); }\n  close() { try { this.pc.close(); } catch (_) {} }\n}\n\nclass Component extends DCLogic {\n  state = { hud: {}, phase: 'menu', netStatus: '', netKind: '' };\n\n  constructor(props) {\n    super(props);\n    this.W = 520; this.H = 290; this.BY = 120; this.RHW = 17;\n    this.phase = 'menu';\n    this.mode = 'ai'; // 'ai' | 'local' | 'host' | 'guest'\n    this.ctrl = { north: this.newCtrl(), south: this.newCtrl() };\n    this.keys = {};\n    this.units = []; this.proj = []; this.fxs = []; this.corpses = [];\n    this.last = 0; this.hudT = 0; this.booted = false;\n    // key schemes\n    this.NSEL = { Digit1: 'infantry', Digit2: 'cavalry', Digit3: 'cannon' };\n    this.NMOVE = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];\n    this.SSEL = { Digit8: 'infantry', Digit9: 'cavalry', Digit0: 'cannon' };\n    this.SMOVE = ['KeyI', 'KeyK', 'KeyJ', 'KeyL'];\n    // net\n    this.net = null; this.myIdx = 0; this.lastSnap = 0; this.lastIntent = 0;\n    this.hostCode = ''; this.joinAnswer = '';\n    this.setCanvas = (el) => { if (el && !this.booted) { this.canvas = el; this.boot(); } };\n    this.onFrameClick = () => { this.handleStart(); };\n  }\n  newCtrl() { return { sel: 'infantry', eng: { infantry: false, cavalry: false, cannon: false }, mx: 0, my: 0 }; }\n\n  // ---- mode-select + online (P2P) handlers ----\n  pickAI = () => this.startGame('ai');\n  pickLocal = () => this.startGame('local');\n  setPhase(p, extra) { this.phase = p; this.setState(Object.assign({ phase: p }, extra || {})); }\n  _newLink() { if (this.net) { try { this.net.close(); } catch (e) {} } this.net = new NetLink((m) => this.onMsg(m), (s) => this.onNetState(s)); }\n  closeNet() { if (this.net) { try { this.net.close(); } catch (e) {} } this.net = null; }\n  _copy(t) { if (!t) return; try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t); } catch (e) {} }\n  openHost = () => {\n    this.myIdx = 0; this.hostCode = ''; this.joinAnswer = '';\n    this._newLink();\n    this.setPhase('host', { netStatus: 'Creating invite code…', netKind: '' });\n    this.net.host().then(code => {\n      this.hostCode = code;\n      if (this.elHostCode) this.elHostCode.value = code;\n      this.setState({ netStatus: 'Send this code to your opponent, then paste their reply below.', netKind: '' });\n    }).catch(e => this.setState({ netStatus: 'Could not create code: ' + e.message, netKind: 'err' }));\n  };\n  openJoin = () => {\n    this.myIdx = 1; this.hostCode = ''; this.joinAnswer = '';\n    this._newLink();\n    this.setPhase('join', { netStatus: '', netKind: '' });\n  };\n  copyHost = () => this._copy(this.elHostCode && this.elHostCode.value);\n  copyJoin = () => this._copy(this.elJoinAnswer && this.elJoinAnswer.value);\n  hostConnect = () => {\n    const v = this.elHostAnswer && this.elHostAnswer.value;\n    if (!v) { this.setState({ netStatus: 'Paste the reply code first.', netKind: 'err' }); return; }\n    this.setState({ netStatus: 'Connecting…', netKind: '' });\n    this.net.acceptAnswer(v).catch(e => this.setState({ netStatus: 'That code did not parse — paste the full reply.', netKind: 'err' }));\n  };\n  joinReply = () => {\n    const v = this.elJoinCode && this.elJoinCode.value;\n    if (!v) { this.setState({ netStatus: 'Paste the invite code first.', netKind: 'err' }); return; }\n    this.setState({ netStatus: 'Creating reply code…', netKind: '' });\n    this.net.join(v).then(code => {\n      this.joinAnswer = code;\n      if (this.elJoinAnswer) this.elJoinAnswer.value = code;\n      this.setState({ netStatus: 'Send this reply to the host, then wait…', netKind: '' });\n    }).catch(e => this.setState({ netStatus: 'That code did not parse — paste the full invite.', netKind: 'err' }));\n  };\n  backToMenu = () => { this.closeNet(); this.mode = 'ai'; this.setPhase('menu', { netStatus: '', netKind: '' }); };\n  refHostCode = (el) => { this.elHostCode = el; if (el && this.hostCode) el.value = this.hostCode; };\n  refHostAnswer = (el) => { this.elHostAnswer = el; };\n  refJoinCode = (el) => { this.elJoinCode = el; };\n  refJoinAnswer = (el) => { this.elJoinAnswer = el; if (el && this.joinAnswer) el.value = this.joinAnswer; };\n\n  onNetState(s) {\n    if (s === 'open') {\n      if (this.myIdx === 0) { this.lastSnap = 0; this.startGame('host'); }\n      else { this.mode = 'guest'; this.setPhase('play', { netStatus: 'Connected!', netKind: 'ok' }); }\n    } else if (s === 'failed' || s === 'disconnected' || s === 'closed') {\n      if (this.mode === 'host' || this.mode === 'guest') {\n        this.closeNet(); this.mode = 'ai';\n        this.setPhase('menu', { netStatus: 'Connection lost.', netKind: 'err' });\n      }\n    }\n  }\n  onMsg(m) {\n    if (!m) return;\n    if (m.t === 's') { if (this.mode === 'guest') this.applySnapshot(m); }\n    else if (m.t === 'i') {\n      if (this.mode === 'host') { const s = this.ctrl.south; s.sel = m.sel; s.eng = m.eng; s.mx = m.mx; s.my = m.my; }\n    }\n  }\n  queueIntent(force) {\n    if (this.mode !== 'guest' || !this.net) return;\n    const now = performance.now();\n    if (!force && now - this.lastIntent < 45) return;\n    this.lastIntent = now;\n    const s = this.ctrl.south;\n    this.net.send({ t: 'i', sel: s.sel, eng: s.eng, mx: s.mx, my: s.my });\n  }\n  sendSnapshot() {\n    const T = { infantry: 0, cavalry: 1, cannon: 2 };\n    const FT = { muzzle: 0, puff: 1, blood: 2, boom: 3 };\n    const sd = (v) => v === 'north' ? 0 : 1;\n    const u = this.units.map(o => [sd(o.side), T[o.type], Math.round(o.x), Math.round(o.y), Math.round(o.hp), Math.round(o.maxhp), o.facing]);\n    const p = this.proj.map(o => o.kind === 'bullet'\n      ? [0, Math.round(o.x), Math.round(o.y), 0, sd(o.side)]\n      : [1, Math.round(o.x), Math.round(o.y), Math.round(o.z || 0), sd(o.side)]);\n    const f = this.fxs.map(o => [FT[o.type], Math.round(o.x), Math.round(o.y), Math.round(o.r || 0), +o.t.toFixed(2), +o.dur.toFixed(2)]);\n    const k = this.corpses.map(o => [Math.round(o.x), Math.round(o.y), sd(o.side), T[o.type]]);\n    const cn = this.ctrl.north, cs = this.ctrl.south;\n    this.net.send({ t: 's', ph: this.phase, u, p, f, k, cn: { sel: cn.sel, eng: cn.eng }, cs: { sel: cs.sel, eng: cs.eng } });\n  }\n  applySnapshot(m) {\n    const TT = ['infantry', 'cavalry', 'cannon'], SD = ['north', 'south'], FTT = ['muzzle', 'puff', 'blood', 'boom'];\n    this.units = m.u.map(a => ({ side: SD[a[0]], type: TT[a[1]], x: a[2], y: a[3], hp: a[4], maxhp: a[5], facing: a[6] }));\n    this.proj = m.p.map(a => ({ kind: a[0] === 0 ? 'bullet' : 'ball', x: a[1], y: a[2], z: a[3], side: SD[a[4]] }));\n    this.fxs = m.f.map(a => ({ type: FTT[a[0]], x: a[1], y: a[2], r: a[3], t: a[4], dur: a[5] }));\n    this.corpses = m.k.map(a => ({ x: a[0], y: a[1], side: SD[a[2]], type: TT[a[3]] }));\n    if (m.cn) { this.ctrl.north.sel = m.cn.sel; this.ctrl.north.eng = m.cn.eng; }\n    if (this.phase !== m.ph) this.phase = m.ph;\n    this.pushHud();\n  }\n\n  // ---- config ----\n  cfg() {\n    const diff = this.props.difficulty || 'Normal';\n    const em = diff === 'Easy' ? 0.78 : diff === 'Hard' ? 1.22 : 1.0;\n    return { em };\n  }\n  sizes() {\n    const s = this.props.armySize || 'Standard';\n    if (s === 'Skirmish') return { inf: 6, cav: 3, can: 1 };\n    if (s === 'Massive') return { inf: 12, cav: 6, can: 3 };\n    return { inf: 9, cav: 4, can: 2 };\n  }\n  get UT() {\n    return {\n      infantry: { speed: 24, range: 62, dmg: 7, rof: 1.15, hp: 30 },\n      cavalry:  { speed: 50, range: 30, dmg: 16, rof: 0.55, hp: 46 },\n      cannon:   { speed: 9,  range: 158, dmg: 34, rof: 3.0, hp: 52 },\n    };\n  }\n\n  // ---- geometry ----\n  riverCX(y) { return 285 + 34 * Math.sin((y / this.H) * 2.2 + 0.5); }\n  isRiver(x, y) { return Math.abs(x - this.riverCX(y)) < this.RHW; }\n  onBridge(y) { return Math.abs(y - this.BY) <= 12; }\n  blocked(x, y) {\n    if (x < 8 || x > this.W - 8 || y < 16 || y > this.H - 9) return true;\n    return this.isRiver(x, y) && !this.onBridge(y);\n  }\n  sideOf(x, y) { return x < this.riverCX(y) ? -1 : 1; }\n  dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }\n\n  // ---- boot / lifecycle ----\n  componentDidMount() {\n    let tries = 0;\n    const find = () => {\n      if (this.booted) return;\n      const el = this.canvas || document.getElementById('ns-battlefield');\n      if (el) { this.canvas = el; this.boot(); return; }\n      if (tries++ < 60) requestAnimationFrame(find);\n    };\n    find();\n  }\n  boot() {\n    if (this.booted) return;\n    this.booted = true;\n    this.setupUnits();\n    this._key = (e) => this.onKey(e);\n    this._up = (e) => { this.keys[e.code] = false; };\n    window.addEventListener('keydown', this._key);\n    window.addEventListener('keyup', this._up);\n    this.last = performance.now();\n    this.timer = setInterval(() => this.loop(performance.now()), 1000 / 60);\n    this.pushHud();\n  }\n  acquire() {\n    const el = document.getElementById('ns-battlefield');\n    if (!el) return false;\n    if (el !== this.canvas || !this.ctx) {\n      this.canvas = el;\n      this.ctx = el.getContext('2d');\n      this.ctx.imageSmoothingEnabled = false;\n    }\n    if (!this.bg) this.bg = this.buildBackground();\n    return true;\n  }\n  componentWillUnmount() {\n    clearInterval(this.timer);\n    window.removeEventListener('keydown', this._key);\n    window.removeEventListener('keyup', this._up);\n  }\n\n  handleStart() {\n    // clicking the field only restarts after a result (menu uses buttons)\n    if ((this.phase === 'victory' || this.phase === 'defeat') && this.mode !== 'guest') this.startGame(this.mode);\n  }\n  startGame(mode) {\n    this.mode = mode;\n    this.ctrl = { north: this.newCtrl(), south: this.newCtrl() };\n    this.setupUnits();\n    this.proj = []; this.fxs = []; this.corpses = [];\n    this.keys = {};\n    this.phase = 'play';\n    this.pushHud();\n  }\n\n  setupUnits() {\n    this.units = [];\n    const sz = this.sizes();\n    const mk = (side, type, x, y) => {\n      const st = this.UT[type];\n      this.units.push({ side, type, x, y, hp: st.hp, maxhp: st.hp, cd: Math.random() * st.rof, facing: side === 'north' ? 1 : -1 });\n    };\n    // NORTH (player) — left bank, lower-left cluster like the screenshot\n    this.cluster(sz.inf, 95, 215, 60, 42, (x, y) => mk('north', 'infantry', x, y));\n    this.cluster(sz.cav, 70, 150, 46, 36, (x, y) => mk('north', 'cavalry', x, y));\n    this.cluster(sz.can, 48, 95, 3  this.ctx; t.fillStyle = c; t.fillRect(Math.round(x), Math.round(y), Math.ceil(w), Math.ceil(h)); }\n\n  draw() {\n    const ctx = this.ctx;\n    if (this.bg) ctx.drawImage(this.bg, 0, 0);\n    else { ctx.fillStyle = '#4e9b30'; ctx.fillRect(0, 0, this.W, this.H); }\n    // corpses\n    for (const k of this.corpses) {\n      const col = k.side === 'north' ? '#1c2c74' : '#525b66';\n      this.pxr(k.x - 3, k.y - 2, 6, 2, col);\n      this.pxr(k.x - 4, k.y, 8, 1, 'rgba(40,20,10,0.35)');\n    }\n    // units sorted by y\n    const us = this.units.slice().sort((a, b) => a.y - b.y);\n    for (const u of us) this.drawUnit(u);\n    // projectiles\n    for (const p of this.proj) this.drawProj(p);\n    // effects\n    for (const f of this.fxs) this.drawFx(f);\n  }\n\n  drawUnit(u) {\n    const f = u.facing || 1;\n    const C = u.side === 'north'\n      ? { coat: '#2a3f9e', dark: '#1c2c74', cap: '#16225c', acc: '#aeb8ff' }\n      : { coat: '#6f7884', dark: '#4d555f', cap: '#8a3232', acc: '#c9ced6' };\n    const flesh = '#e3a877';\n    const x = Math.round(u.x), y = Math.round(u.y);\n    if (u.type === 'infantry') this.drawInf(x, y, f, C, flesh);\n    else if (u.type === 'cavalry') this.drawCav(x, y, f, C, flesh);\n    else this.drawCan(x, y, f, C, flesh);\n    // hp bar\n    if (u.hp < u.maxhp) {\n      const top = u.type === 'cavalry' ? y - 20 : u.type === 'cannon' ? y - 17 : y - 18;\n      this.pxr(x - 4, top, 8, 1, '#3a0c0c');\n      const pct = Math.max(0, u.hp / u.maxhp);\n      this.pxr(x - 4, top, Math.round(8 * pct), 1, pct > 0.5 ? '#5ad24a' : pct > 0.25 ? '#e0c040' : '#e04040');\n    }\n    // selection marker (only for human-controlled sides on this device)\n    const markN = this.mode !== 'guest';\n    const markS = (this.mode === 'local' || this.mode === 'guest');\n    if ((u.side === 'north' && markN) || (u.side === 'south' && markS)) {\n      const cc = this.ctrl[u.side];\n      if (u.type === cc.sel) {\n        const col = cc.eng[u.type] ? '#ff5b5b' : '#ffd24a';\n        this.pxr(x - 4, y + 1, 8, 1, col);\n      }\n    }\n  }\n\n  drawInf(x, y, f, C, flesh) {\n    this.pxr(x - 2, y - 4, 2, 4, C.dark);\n    this.pxr(x, y - 4, 2, 4, C.dark);\n    this.pxr(x - 2, y - 1, 2, 1, '#181818');\n    this.pxr(x, y - 1, 2, 1, '#181818');\n    this.pxr(x - 2, y - 10, 5, 7, C.coat);\n    this.pxr(x - 2, y - 6, 5, 1, '#181818');\n    this.pxr(x - 2, y - 9, 4, 2, C.dark);\n    this.pxr(x - 1, y - 13, 3, 3, flesh);\n    this.pxr(x - 2, y - 15, 4, 2, C.cap);\n    const rb = f > 0 ? x + 1 : x - 9;\n    this.pxr(rb, y - 10, 8, 1, '#2a2a2a');\n    this.pxr(f > 0 ? x + 1 : x - 2, y - 9, 2, 1, '#5a3a1a');\n  }\n  drawCav(x, y, f, C, flesh) {\n    const horse = '#7a4a24', hd = '#5e3818';\n    this.pxr(x - 7, y - 7, 13, 5, horse);\n    this.pxr(f > 0 ? x + 6 : x - 8, y - 9, 3, 3, horse);\n    this.pxr(f > 0 ? x + 8 : x - 8, y - 10, 1, 2, hd);\n    this.pxr(f > 0 ? x - 8 : x + 7, y - 8, 1, 4, hd);\n    this.pxr(x - 6, y - 2, 1, 3, hd); this.pxr(x - 3, y - 2, 1, 3, hd);\n    this.pxr(x + 2, y - 2, 1, 3, hd); this.pxr(x + 5, y - 2, 1, 3, hd);\n    this.pxr(x - 2, y - 13, 4, 6, C.coat);\n    this.pxr(x - 1, y - 16, 3, 3, flesh);\n    this.pxr(x - 2, y - 18, 4, 2, C.cap);\n    const sb = f > 0 ? x + 3 : x - 9;\n    this.pxr(sb, y - 16, 7, 1, '#d8d8e0');\n  }\n  drawCan(x, y, f, C, flesh) {\n    // crewman behind barrel\n    const cbx = f > 0 ? x - 9 : x + 7;\n    this.pxr(cbx, y - 12, 3, 5, C.coat);\n    this.pxr(cbx, y - 14, 3, 2, C.cap);\n    // wheels\n    this.drawWheel(x - 4, y - 2); this.drawWheel(x + 4, y - 2);\n    // carriage\n    this.pxr(x - 6, y - 6, 12, 2, '#6a4a24');\n    this.pxr(f > 0 ? x + 5 : x - 8, y - 6, 3, 4, '#5a3a1c');\n    // barrel\n    const bx = f > 0 ? x - 1 : x - 10;\n    this.pxr(bx, y - 9, 11, 3, '#3a3f47');\n    this.pxr(bx, y - 9, 11, 1, '#565d68');\n    this.pxr(f > 0 ? bx + 10 : bx, y - 9, 1, 3, '#222');\n  }\n  drawWheel(wx, wy) {\n    this.pxr(wx - 2, wy - 2, 4, 4, '#3a230f');\n    this.pxr(wx - 1, wy - 1, 2, 2, '#7a4a24');\n    this.pxr(wx - 2, wy, 4, 1, '#2a1808');\n    this.pxr(wx, wy - 2, 1, 4, '#2a1808');\n  }\n\n  drawProj(p) {\n    const ctx = this.ctx;\n    if (p.kind === 'bullet') {\n      this.pxr(p.x - 1, p.y - 1, 2, 2, p.side === 'north' ? '#fff2a8' : '#ffd0a0');\n    } else {\n      this.pxr(p.x - 1, p.y + 1, 3, 1, 'rgba(0,0,0,0.28)');\n      const by = p.y - (p.z || 0);\n      this.pxr(p.x - 1, by - 1, 3, 3, '#1a1a1a');\n      this.pxr(p.x - 1, by - 1, 1, 1, '#5a5a5a');\n    }\n  }\n  drawFx(f) {\n    const ctx = this.ctx;\n    const k = f.t / f.dur;\n    if (f.type === 'muzzle') {\n      ctx.fillStyle = '#ffe27a';\n      ctx.fillRect(Math.round(f.x - 2), Math.round(f.y - 1), 4, 2);\n      ctx.fillRect(Math.round(f.x - 1), Math.round(f.y - 2), 2, 4);\n    } else if (f.type === 'puff') {\n      ctx.globalAlpha = 1 - k;\n      ctx.fillStyle = '#d8d2c0';\n      const r = 1 + k * 3;\n      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, 7); ctx.fill();\n      ctx.globalAlpha = 1;\n    } else if (f.type === 'blood') {\n      ctx.globalAlpha = 1 - k;\n      ctx.fillStyle = '#b41e1e';\n      ctx.fillRect(Math.round(f.x - 1), Math.round(f.y - 1 - k * 3), 2, 2);\n      ctx.fillRect(Math.round(f.x + 1), Math.round(f.y - k * 4), 1, 1);\n      ctx.globalAlpha = 1;\n    } else if (f.type === 'boom') {\n      const R = f.r || 18;\n      ctx.globalAlpha = 1 - k;\n      ctx.fillStyle = '#3a2a18'; ctx.beginPath(); ctx.arc(f.x, f.y, R * (0.5 + k * 0.7), 0, 7); ctx.fill();\n      ctx.fillStyle = '#e0641e'; ctx.beginPath(); ctx.arc(f.x, f.y, R * (0.3 + k * 0.55), 0, 7); ctx.fill();\n      ctx.fillStyle = '#ffd23a'; ctx.beginPath(); ctx.arc(f.x, f.y, R * (0.15 + k * 0.32), 0, 7); ctx.fill();\n      ctx.globalAlpha = 1;\n    }\n  }\n\n  // ---- static background ----\n  buildBackground() {\n    const cv = document.createElement('canvas');\n    cv.width = this.W; cv.height = this.H;\n    const g = cv.getContext('2d');\n    const bp = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.ceil(w), Math.ceil(h)); };\n    const hash = (x, y) => ((x * 73856093) ^ (y * 19349663)) >>> 0;\n\n    // grass base + dither\n    bp(0, 0, this.W, this.H, '#4e9b30');\n    for (let y = 0; y < this.H; y += 2) {\n      for (let x = 0; x < this.W; x += 2) {\n        const hv = hash(x, y) % 13;\n        if (hv === 0) bp(x, y, 2, 2, '#3f8526');\n        else if (hv === 1) bp(x, y, 2, 2, '#5cae39');\n        else if (hv === 7) bp(x, y, 1, 1, '#2f6b1c');\n      }\n    }\n    // scattered bushes\n    const bushes = [[210, 250], [380, 250], [430, 270], [120, 60], [330, 230], [150, 260]];\n    for (const [bx, by] of bushes) {\n      bp(bx - 4, by - 2, 9, 4, '#2f6b1c');\n      bp(bx - 2, by - 4, 6, 3, '#3a7a22');\n    }\n\n    // road (horizontal) — drawn before river so the river interrupts it\n    const ry0 = this.BY - 10, rh = 21;\n    bp(0, ry0, this.W, rh, '#cdbf73');\n    bp(0, ry0, this.W, 1, '#a9974f');\n    bp(0, ry0 + rh - 1, this.W, 1, '#a9974f');\n    for (let x = 0; x < this.W; x += 7) { bp(x, ry0 + 6, 3, 1, '#bdab5e'); bp(x + 3, ry0 + 13, 3, 1, '#bdab5e'); }\n\n    // river\n    for (let y = 0; y < this.H; y++) {\n      const cx = this.riverCX(y), hw = this.RHW;\n      bp(cx - hw - 2, y, 2, 1, '#b89a44');\n      bp(cx + hw, y, 2, 1, '#d8c266');\n      bp(cx - hw, y, 2 * hw, 1, '#2f6fd6');\n      bp(cx - hw + 1, y, 4, 1, '#234fb0');\n      const sx = cx - 4 + Math.sin(y * 0.22) * 5;\n      bp(sx, y, 3, 1, '#5fa0ea');\n      bp(cx + 4 + Math.sin(y * 0.17 + 1) * 4, y, 2, 1, '#7fb6f2');\n      if (y % 6 < 1) { bp(cx - hw, y, 1, 1, '#cfe6ff'); bp(cx + hw - 1, y, 1, 1, '#cfe6ff'); }\n    }\n\n    // bridge over the river at the road\n    const bx = this.riverCX(this.BY), bw = 32;\n    // support trusses in the water\n    bp(bx - 14, this.BY + 4, 3, 9, '#6a4420');\n    bp(bx + 11, this.BY + 4, 3, 9, '#6a4420');\n    for (let i = -bw; i < bw; i += 6) bp(bx + i, this.BY + 5, 4, 1, '#5a3a1c');\n    // deck\n    bp(bx - bw, this.BY - 3, bw * 2, 7, '#c79a4e');\n    for (let i = 0; i <= bw * 2; i += 5) bp(bx - bw + i, this.BY - 3, 1, 7, '#8a5a28');\n    // abutments\n    bp(bx - bw - 3, this.BY - 3, 4, 7, '#9a6a3a');\n    bp(bx + bw - 1, this.BY - 3, 4, 7, '#9a6a3a');\n    // railings\n    bp(bx - bw, this.BY - 8, bw * 2, 2, '#b8863c');\n    bp(bx - bw, this.BY + 5, bw * 2, 1, '#7a4a1c');\n    for (let i = -bw; i <= bw; i += 7) bp(bx + i, this.BY - 8, 1, 4, '#9a6a2c');\n\n    // fort (top-right)\n    const fx = 452, fy = 36;\n    bp(fx - 24, fy + 2, 48, 20, '#9a6a3a');\n    bp(fx - 24, fy + 2, 48, 2, '#7a5028');\n    // roof\n    bp(fx - 27, fy, 54, 3, '#7a241a');\n    bp(fx - 22, fy - 4, 44, 4, '#b03826');\n    bp(fx - 15, fy - 8, 30, 4, '#c5462e');\n    bp(fx - 6, fy - 11, 12, 3, '#c5462e');\n    // chimney\n    bp(fx + 10, fy - 14, 4, 5, '#6a4028');\n    // windows + door\n    bp(fx - 16, fy + 8, 5, 6, '#2a3a4a'); bp(fx + 11, fy + 8, 5, 6, '#2a3a4a');\n    bp(fx - 4, fy + 9, 7, 11, '#3a2818');\n    for (let i = 0; i < 5; i++) bp(fx - 24, fy + 4 + i * 4, 48, 1, '#8a5e30');\n\n    // big tree (mid-left, like screenshot)\n    const tx = 150, ty = 96;\n    bp(tx - 2, ty, 4, 14, '#6a431f');\n    bp(tx - 2, ty + 6, 4, 1, '#4a2d12');\n    const canopy = [[0, -4, 12], [-8, 0, 9], [8, 0, 9], [-4, -8, 8], [5, -8, 8], [0, 4, 10]];\n    for (const [ox, oy, r] of canopy) { bp(tx + ox - r / 2, ty + oy - r / 2 - 6, r, r, '#2f7a22'); }\n    for (const [ox, oy, r] of canopy) { bp(tx + ox - r / 2 + 1, ty + oy - r / 2 - 7, r - 3, r - 3, '#3f9a2e'); }\n    // small tree top-left\n    bp(70, 40, 3, 9, '#6a431f');\n    bp(66, 30, 11, 11, '#2f7a22'); bp(68, 29, 7, 7, '#3f9a2e');\n\n    // rocks (bottom-right)\n    const rocks = [[470, 258], [486, 264], [462, 270]];\n    for (const [rx, ryy] of rocks) {\n      bp(rx - 5, ryy - 3, 11, 6, '#9aa0a8');\n      bp(rx - 3, ryy - 5, 7, 3, '#b6bcc4');\n      bp(rx - 5, ryy + 2, 11, 1, '#6a7078');\n    }\n\n    return cv;\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"</script>
